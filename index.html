
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071321">
  <title>MESSINTINA FC 3D</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #071321;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      text-align: center;
    }
    main { padding: 24px; }
    .logo {
      font-size: clamp(32px, 8vw, 64px);
      font-weight: 900;
      letter-spacing: 2px;
      color: #9bdcff;
      text-shadow: 0 0 20px #168bff;
    }
    p { color: #c4d9ed; letter-spacing: 3px; }
    button {
      margin-top: 28px;
      padding: 16px 52px;
      border: 2px solid #8bd5ff;
      border-radius: 8px;
      background: linear-gradient(120deg,#0755a3,#101d35);
      color: white;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">MESSINTINA FC 3D</div>
    <p>THE ARGENTINA FOOTBALL EXPERIENCE</p>
    <button onclick="alert('Welcome to MESSINTINA FC 3D!')">
      PLAY NOW
    </button>
  </main>
</body>
  </html>
