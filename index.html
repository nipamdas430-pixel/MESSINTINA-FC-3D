
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MESSINTINA FC 3D</title>

  <meta name="description" content="MESSINTINA FC 3D - Play an exciting 3D football game with Argentina-inspired style.">
  <meta name="theme-color" content="#071321">

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #020914, #102b48);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 35px 20px;
      border: 1px solid #2876a8;
      border-radius: 22px;
      background: rgba(5, 20, 38, 0.92);
      box-shadow: 0 0 30px #071e36;
    }

    .logo {
      font-size: 65px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 30px;
      color: #8bd5ff;
      margin: 10px 0;
    }

    p {
      color: #c5d9eb;
      line-height: 1.6;
    }

    .play {
      display: block;
      margin: 30px auto 15px;
      padding: 17px;
      width: 100%;
      border-radius: 12px;
      background: #168bd0;
      color: white;
      font-size: 19px;
      font-weight: bold;
      text-decoration: none;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #8ba9c2;
    }
  </style>
</head>

<body>

  <main class="container">
    <div class="logo">⚽</div>

    <h1>MESSINTINA FC 3D</h1>

    <p>
      THE FOOTBALL EXPERIENCE
      <br>
      Argentina Inspired • 3D Football • Mobile Gaming
    </p>

    <a class="play" href="./game.html">
      PLAY NOW ⚽
    </a>

    <p>Move. Pass. Shoot. Score.</p>

    <div class="footer">
      MESSINTINA FC 3D © 2026
    </div>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>

</body>
  </html>
