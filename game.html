
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#071321">
<title>MESSINTINA FC 3D</title>
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#071321;color:white;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:12px;width:100%;text-align:center;pointer-events:none;z-index:2}
#hud h2{margin:0;color:#9bdcff;letter-spacing:2px;text-shadow:0 0 15px #168bff}
#score{margin-top:6px}
#message{position:fixed;top:65px;width:100%;text-align:center;font-size:12px;color:#cdeaff;pointer-events:none}
#controls{position:fixed;bottom:18px;left:0;width:100%;padding:0 20px;display:flex;justify-content:space-between;align-items:end;z-index:3}
#stick{width:115px;height:115px;border:2px solid #9bdcff;border-radius:50%;background:#0b294c99;position:relative;touch-action:none}
#knob{position:absolute;width:45px;height:45px;left:33px;top:33px;border-radius:50%;background:#9bdcff;box-shadow:0 0 15px #168bff}
.actions{display:flex;gap:12px;align-items:end}
button{width:68px;height:68px;border:2px solid #9bdcff;border-radius:50%;background:#103d70;color:white;font-weight:bold;font-size:12px}
#shoot{width:82px;height:82px;background:#0877c9}
#rotate{display:none;position:fixed;inset:0;background:#071321;z-index:10;align-items:center;justify-content:center;text-align:center}
@media(orientation:portrait){#rotate{display:flex}}
</style>
</head>

<body>

<div id="hud">
<h2>MESSINTINA FC 3D</h2>
<div id="score">ARG 0 - 0 OPP</div>
</div>

<div id="message">DRIBBLE • PASS • SHOOT</div>

<div id="controls">
<div id="stick"><div id="knob"></div></div>
<div class="actions">
<button id="pass">PASS</button>
<button id="shoot">SHOOT</button>
</div>
</div>

<div id="rotate">🇦🇷<br><br>Please rotate your phone to landscape mode.</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// SCENE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x071626);
scene.fog=new THREE.Fog(0x071626,60,120);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,200);
camera.position.set(0,25,32);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

// LIGHTS
scene.add(new THREE.HemisphereLight(0xb9e5ff,0x18351f,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-15,35,15);
sun.castShadow=true;
scene.add(sun);

for(const side of [-1,1]){
const light=new THREE.PointLight(0x8ccfff,35,35);
light.position.set(side*27,12,-20);
scene.add(light);
}

// FOOTBALL GROUND
const grass=new THREE.Mesh(
new THREE.PlaneGeometry(60,90),
new THREE.MeshStandardMaterial({color:0x14713e})
);
grass.rotation.x=-Math.PI/2;
grass.receiveShadow=true;
scene.add(grass);

function fieldLine(x,z,w,h){
const m=new THREE.Mesh(
new THREE.PlaneGeometry(w,h),
new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide})
);
m.rotation.x=-Math.PI/2;
m.position.set(x,.04,z);
scene.add(m);
}

fieldLine(0,-44,60,.16);
fieldLine(0,44,60,.16);
fieldLine(-29,0,.16,90);
fieldLine(29,0,.16,90);
fieldLine(0,0,60,.15);
fieldLine(0,-34,22,.15);
fieldLine(0,34,22,.15);

const circle=new THREE.Mesh(
new THREE.RingGeometry(5.9,6.05,64),
new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide})
);
circle.rotation.x=-Math.PI/2;
circle.position.y=.05;
scene.add(circle);

// STADIUM STANDS
for(const side of [-1,1]){
const stand=new THREE.Mesh(
new THREE.BoxGeometry(13,7,94),
new THREE.MeshStandardMaterial({color:0x101d31})
);
stand.position.set(side*36,3.5,0);
scene.add(stand);
}

// GOAL
const goalMat=new THREE.MeshStandardMaterial({color:0xffffff});
function goalBar(x,y,z,w,h,d){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),goalMat);
m.position.set(x,y,z);
scene.add(m);
}
goalBar(-5,1.5,-43,.18,3,.18);
goalBar(5,1.5,-43,.18,3,.18);
goalBar(0,3,-43,10,.18,.18);

// PLAYER
const player=new THREE.Group();
const blue=new THREE.MeshStandardMaterial({color:0x168bdf});
const white=new THREE.MeshStandardMaterial({color:0xf2f7ff});
const skin=new THREE.MeshStandardMaterial({color:0xc98d62});

const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.9,4,8),blue);
body.position.y=1.35;
player.add(body);

const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),skin);
head.position.y=2.35;
player.add(head);

const shorts=new THREE.Mesh(new THREE.BoxGeometry(.85,.42,.5),white);
shorts.position.y=.72;
player.add(shorts);

for(const x of [-.24,.24]){
const leg=new THREE.Mesh(new THREE.CylinderGeometry(.13,.16,.7,10),white);
leg.position.set(x,.35,0);
player.add(leg);
}

player.position.set(0,0,12);
scene.add(player);

// FOOTBALL
const ball=new THREE.Mesh(
new THREE.SphereGeometry(.38,32,24),
new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5})
);
ball.castShadow=true;
scene.add(ball);

// Ball pattern
const black=new THREE.MeshStandardMaterial({color:0x151515});
for(let i=0;i<5;i++){
const patch=new THREE.Mesh(
new THREE.CircleGeometry(.11,5),
black
);
patch.position.set(
Math.sin(i*1.25)*.3,
Math.cos(i*1.25)*.3,
.25
);
ball.add(patch);
}

let score=0;
let lastGoal=0;
const velocity=new THREE.Vector3();

// JOYSTICK
const stick=document.getElementById('stick');
const knob=document.getElementById('knob');
const input={x:0,y:0};
let active=false;

function moveStick(e){
const r=stick.getBoundingClientRect();
let dx=e.clientX-(r.left+r.width/2);
let dy=e.clientY-(r.top+r.height/2);
const len=Math.hypot(dx,dy)||1;
const scale=Math.min(1,42/len);
input.x=dx/len*scale;
input.y=dy/len*scale;
knob.style.transform=`translate(${input.x*42}px,${input.y*42}px)`;
}

stick.addEventListener('pointerdown',e=>{
active=true;
stick.setPointerCapture(e.pointerId);
moveStick(e);
});
stick.addEventListener('pointermove',e=>{
if(active)moveStick(e);
});

function stopStick(){
active=false;
input.x=0;
input.y=0;
knob.style.transform='translate(0,0)';
}
stick.addEventListener('pointerup',stopStick);
stick.addEventListener('pointercancel',stopStick);

// BALL POSITION AND KICK
function resetBall(){
ball.position.set(player.position.x,.38,player.position.z+1.3);
velocity.set(0,0,0);
}

function kick(power){
const distance=ball.position.distanceTo(
new THREE.Vector3(player.position.x,ball.position.y,player.position.z)
);
if(distance>3.5)return;

velocity.set(input.x*.16,-.04,-power);
}

document.getElementById('shoot').addEventListener('pointerdown',()=>{
kick(.85);
});

document.getElementById('pass').addEventListener('pointerdown',()=>{
kick(.42);
});

// GAME LOOP
let previous=performance.now();

function animate(now){
requestAnimationFrame(animate);
const dt=Math.min((now-previous)/16.67,2);
previous=now;

// PLAYER MOVEMENT
player.position.x+=input.x*.14*dt;
player.position.z+=input.y*.14*dt;

player.position.x=THREE.MathUtils.clamp(player.position.x,-27,27);
player.position.z=THREE.MathUtils.clamp(player.position.z,-40,39);

// BALL PHYSICS
ball.position.addScaledVector(velocity,dt);
velocity.multiplyScalar(Math.pow(.985,dt));
velocity.y-=.012*dt;

if(ball.position.y<.38){
ball.position.y=.38;
velocity.y=Math.abs(velocity.y)*.45;
}

if(Math.abs(ball.position.x)>29)velocity.x*=-.65;
if(Math.abs(ball.position.z)>44)velocity.z*=-.65;

// BALL FOLLOW WHEN CLOSE AND SLOW
const distance=ball.position.distanceTo(
new THREE.Vector3(player.position.x,ball.position.y,player.position.z)
);
if(distance<1.8 && velocity.length()<.06){
ball.position.x=player.position.x;
ball.position.z=player.position.z+1.3;
}

// GOAL DETECTION
if(ball.position.z<-42 &&
Math.abs(ball.position.x)<5 &&
now-lastGoal>1500){
score++;
document.getElementById('score').textContent=`ARG ${score} - 0 OPP`;
lastGoal=now;
player.position.set(0,0,12);
resetBall();
}

// CAMERA
camera.position.lerp(
new THREE.Vector3(player.position.x*.4,25,player.position.z+32),
.07
);
camera.lookAt(player.position.x*.35,0,player.position.z-8);

renderer.render(scene,camera);
}

resetBall();
requestAnimationFrame(animate);

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>

<script>
if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("./sw.js")
.then(()=>console.log("Offline system registered"))
.catch(error=>console.error("Offline setup:",error));
});
}
</script>

</body>
</html>
